name: Navigator App CI

on:
    pull_request:
        branches: [main]
    push:
        branches: [main]

concurrency:
    group: navigator-ci-${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: true

permissions:
    contents: read

env:
    FLEETBASE_KEY: ${{ secrets.FLEETBASE_KEY }}
    GOOGLE_MAPS_API_KEY: ${{ secrets.GOOGLE_MAPS_API_KEY }}
    TRANSISTORSOFT_LICENSE_KEY_ANDROID: ${{ secrets.TRANSISTORSOFT_LICENSE_KEY }}
    TRANSISTORSOFT_LICENSE_KEY_IOS: ${{ secrets.TRANSISTORSOFT_LICENSE_KEY }}

jobs:
    install_and_test:
        runs-on: ubuntu-latest
        outputs:
            cache-key: ${{ steps.cache-key.outputs.key }}
        steps:
            - name: Checkout code
              uses: actions/checkout@v6

            - name: Setup Node.js
              uses: actions/setup-node@v6
              with:
                  node-version: '20.19.4'
                  cache: 'yarn'

            - name: Enable Corepack
              run: corepack enable

            - name: Activate Yarn 3.6.4
              run: corepack prepare yarn@3.6.4 --activate

            - name: Get yarn cache directory path
              id: yarn-cache-dir-path
              run: echo "dir=$(yarn config get cacheFolder)" >> $GITHUB_OUTPUT

            - name: Cache yarn dependencies
              uses: actions/cache@v5
              id: yarn-cache
              with:
                  path: ${{ steps.yarn-cache-dir-path.outputs.dir }}
                  key: ${{ runner.os }}-yarn-${{ hashFiles('**/yarn.lock') }}
                  restore-keys: |
                      ${{ runner.os }}-yarn-

            - name: Install dependencies
              run: yarn install --immutable

            - name: Create .env file
              run: |
                  echo "APP_NAME=Navigator" > .env
                  echo "APP_IDENTIFIER=io.fleetbase.navigator" >> .env
                  echo "APP_LINK_PREFIX=flbnavigator" >> .env
                  echo "FLEETBASE_KEY=${{ secrets.FLEETBASE_KEY }}" >> .env
                  echo "GOOGLE_MAPS_API_KEY=${{ secrets.GOOGLE_MAPS_API_KEY }}" >> .env
                  echo "FACEBOOK_APP_ID=${{ secrets.FACEBOOK_APP_ID }}" >> .env
                  echo "FACEBOOK_CLIENT_TOKEN=${{ secrets.FACEBOOK_CLIENT_TOKEN }}" >> .env
                  echo "GOOGLE_CLIENT_ID=${{ secrets.GOOGLE_CLIENT_ID }}" >> .env
                  echo "GOOGLE_IOS_CLIENT_ID=${{ secrets.GOOGLE_IOS_CLIENT_ID }}" >> .env
                  echo "TRANSISTORSOFT_LICENSE_KEY_ANDROID=$TRANSISTORSOFT_LICENSE_KEY_ANDROID" >> .env
                  echo "TRANSISTORSOFT_LICENSE_KEY_IOS=$TRANSISTORSOFT_LICENSE_KEY_IOS" >> .env

            - name: Generate cache key
              id: cache-key
              run: echo "key=${{ runner.os }}-deps-${{ hashFiles('**/yarn.lock', '**/package.json') }}" >> $GITHUB_OUTPUT

            - name: Run behavior tests
              run: yarn test --ci --runInBand --no-watchman

    android_build:
        runs-on: ubuntu-latest
        needs: install_and_test
        steps:
            - name: Checkout code
              uses: actions/checkout@v6

            - name: Setup Node.js
              uses: actions/setup-node@v6
              with:
                  node-version: '20.19.4'
                  cache: 'yarn'

            - name: Enable Corepack
              run: corepack enable

            - name: Activate Yarn 3.6.4
              run: corepack prepare yarn@3.6.4 --activate

            - name: Cache yarn dependencies
              uses: actions/cache@v5
              with:
                  path: |
                      ~/.yarn/cache
                      **/node_modules
                  key: ${{ needs.install_and_test.outputs.cache-key }}
                  restore-keys: |
                      ${{ runner.os }}-deps-

            - name: Install dependencies
              run: yarn install --immutable

            - name: Configure Node binary for Gradle
              run: echo "NODE_BINARY=$(command -v node)" >> $GITHUB_ENV

            - name: Create .env file
              run: |
                  echo "APP_NAME=Navigator" > .env
                  echo "APP_IDENTIFIER=io.fleetbase.navigator" >> .env
                  echo "APP_LINK_PREFIX=flbnavigator" >> .env
                  echo "FLEETBASE_KEY=${{ secrets.FLEETBASE_KEY }}" >> .env
                  echo "GOOGLE_MAPS_API_KEY=${{ secrets.GOOGLE_MAPS_API_KEY }}" >> .env
                  echo "FACEBOOK_APP_ID=${{ secrets.FACEBOOK_APP_ID }}" >> .env
                  echo "FACEBOOK_CLIENT_TOKEN=${{ secrets.FACEBOOK_CLIENT_TOKEN }}" >> .env
                  echo "GOOGLE_CLIENT_ID=${{ secrets.GOOGLE_CLIENT_ID }}" >> .env
                  echo "GOOGLE_IOS_CLIENT_ID=${{ secrets.GOOGLE_IOS_CLIENT_ID }}" >> .env
                  echo "TRANSISTORSOFT_LICENSE_KEY_ANDROID=$TRANSISTORSOFT_LICENSE_KEY_ANDROID" >> .env
                  echo "ANDROID_VERSION_CODE=1" >> .env
                  echo "ANDROID_VERSION_NAME=ci" >> .env

            - name: Generate google-services.json
              env:
                  GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
              run: |
                  echo "$GOOGLE_SERVICES_JSON" > android/app/google-services.json

            # Use JDK 21 to match your local environment
            - name: Set up JDK 21
              uses: actions/setup-java@v5
              with:
                  distribution: 'temurin'
                  java-version: '21'

            - name: Set up Android SDK 36
              uses: android-actions/setup-android@v3

            - name: Install Android SDK components
              run: sdkmanager "platforms;android-36" "build-tools;36.0.0" "ndk;27.1.12297006"

            - name: Cache Gradle Wrapper
              uses: actions/cache@v5
              with:
                  path: ~/.gradle/wrapper
                  key: ${{ runner.os }}-gradle-wrapper-${{ hashFiles('**/gradle-wrapper.properties') }}

            - name: Cache Gradle Dependencies
              uses: actions/cache@v5
              with:
                  path: ~/.gradle/caches
                  key: ${{ runner.os }}-gradle-caches-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
                  restore-keys: |
                      ${{ runner.os }}-gradle-caches-

            - name: Make Gradlew Executable
              run: cd android && chmod +x ./gradlew

            - name: Build Android Debug APK
              run: |
                  cd android
                  ./gradlew assembleDebug --no-daemon --stacktrace

            - name: Upload Android APK
              uses: actions/upload-artifact@v6
              with:
                  name: android-debug-apk
                  path: android/app/build/outputs/apk/debug/app-debug.apk
                  retention-days: 30

    ios_build:
        runs-on: macos-latest
        needs: install_and_test
        steps:
            - name: Checkout code
              uses: actions/checkout@v6

            - name: Setup Xcode
              uses: maxim-lobanov/setup-xcode@v1
              with:
                  xcode-version: latest-stable

            - name: Setup Ruby and Bundler
              uses: ruby/setup-ruby@v1
              with:
                  ruby-version: '3.2'
                  bundler-cache: true

            - name: Setup Node.js
              uses: actions/setup-node@v6
              with:
                  node-version: '20.19.4'
                  cache: 'yarn'

            - name: Enable Corepack
              run: corepack enable

            - name: Activate Yarn 3.6.4
              run: corepack prepare yarn@3.6.4 --activate

            - name: Cache yarn dependencies
              uses: actions/cache@v5
              with:
                  path: |
                      ~/.yarn/cache
                      **/node_modules
                  key: ${{ needs.install_and_test.outputs.cache-key }}
                  restore-keys: |
                      ${{ runner.os }}-deps-

            - name: Install dependencies
              run: yarn install --immutable

            - name: Configure Node binary for native build
              run: echo "NODE_BINARY=$(command -v node)" >> $GITHUB_ENV

            - name: Create .env file
              run: |
                  echo "APP_NAME=Navigator" > .env
                  echo "APP_IDENTIFIER=io.fleetbase.navigator" >> .env
                  echo "APP_LINK_PREFIX=flbnavigator" >> .env
                  echo "FLEETBASE_KEY=${{ secrets.FLEETBASE_KEY }}" >> .env
                  echo "GOOGLE_MAPS_API_KEY=${{ secrets.GOOGLE_MAPS_API_KEY }}" >> .env
                  echo "FACEBOOK_APP_ID=${{ secrets.FACEBOOK_APP_ID }}" >> .env
                  echo "FACEBOOK_CLIENT_TOKEN=${{ secrets.FACEBOOK_CLIENT_TOKEN }}" >> .env
                  echo "GOOGLE_CLIENT_ID=${{ secrets.GOOGLE_CLIENT_ID }}" >> .env
                  echo "GOOGLE_IOS_CLIENT_ID=${{ secrets.GOOGLE_IOS_CLIENT_ID }}" >> .env
                  echo "TRANSISTORSOFT_LICENSE_KEY_IOS=$TRANSISTORSOFT_LICENSE_KEY_IOS" >> .env

            - name: Cache CocoaPods
              uses: actions/cache@v5
              with:
                  path: |
                      ios/Pods
                      ~/Library/Caches/CocoaPods
                      ~/.cocoapods
                  key: ${{ runner.os }}-pods-${{ hashFiles('**/Podfile.lock') }}
                  restore-keys: |
                      ${{ runner.os }}-pods-

            - name: Install CocoaPods
              run: |
                  cd ios && bundle exec pod install

            - name: List available simulators
              run: xcrun simctl list devices available | grep iPhone

            - name: Build iOS app for simulator
              run: |
                  cd ios

                  # Try to find an available iPhone simulator
                  AVAILABLE_SIMULATORS=$(xcrun simctl list devices available | grep "iPhone" | head -5)
                  echo "Available iPhone simulators:"
                  echo "$AVAILABLE_SIMULATORS"

                  # Extract the first iPhone simulator ID
                  SIMULATOR_ID=$(echo "$AVAILABLE_SIMULATORS" | head -1 | grep -o '[A-F0-9-]\{36\}' | head -1)

                  if [ -n "$SIMULATOR_ID" ]; then
                      echo "Using iPhone simulator ID: $SIMULATOR_ID"
                      DESTINATION="id=$SIMULATOR_ID"
                  else
                      echo "No iPhone simulator found, trying generic iOS Simulator destination"
                      DESTINATION="generic/platform=iOS Simulator"
                  fi

                  echo "Building with destination: $DESTINATION"

                  xcodebuild -workspace NavigatorApp.xcworkspace \
                    -scheme NavigatorApp \
                    -configuration Debug \
                    -sdk iphonesimulator \
                    -destination "$DESTINATION" \
                    -derivedDataPath build \
                    -allowProvisioningUpdates \
                    build

            - name: Upload iOS build artifacts
              uses: actions/upload-artifact@v6
              with:
                  name: ios-debug-build
                  path: ios/build/Build/Products/Debug-iphonesimulator/
                  retention-days: 30
